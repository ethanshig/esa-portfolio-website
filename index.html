/* Structure is constant (the esa lattice, ribbons, Sato). Each place only swaps these tokens. */
:root {

  --L: clamp(28px, 5.667vw, 96px);

  --ink: #161616;
  --muted: #6e6b62;
  --line: rgba(22, 22, 22, 0.2);
  --accent: #bb3c28;
  --record: #9a2f1f;
  --card: rgba(255, 255, 255, 0.3);
  --trace-w: clamp(340px, 33vw, 520px);
  --sheet-h: 52vh;
  --peek: 118px;
}
[data-place="pilar"]     { --ground: #eadfcc; --ink: #2a2119; --muted: #6f604f; --line: rgba(42,33,25,.22); --accent: #6a58a6; --record: #4f3f8c; }
[data-place="kankakee"]  { --ground: #dfe3d7; --ink: #1b231d; --muted: #56625a; --line: rgba(27,35,29,.22); --accent: #85562c; --record: #6c4420; }
[data-place="champaign"] { --ground: #ede3c6; --ink: #1f1b13; --muted: #665d49; --line: rgba(31,27,19,.22); --accent: #a3412b; --record: #8a3321; }
[data-place="east-chicago"] { --ground: #dcd8d0; --ink: #1d1a17; --muted: #625d55; --line: rgba(29,26,23,.22); --accent: #4f7f6f; --record: #3c6557; }

* { box-sizing: border-box; }
html { background: var(--ground); transition: background-color 1.2s ease; }
body { margin: 0; padding-inline: var(--L); min-height: 100vh; background: var(--ground); color: var(--ink); font-family: Sato, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; transition: background-color 1.2s ease, color 1.2s ease; }
/* The lattice: touching circles of radius L, the geometry the esa letters are cut from. */
body::before, .trace::before {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; content: ""; opacity: 0.55;
  background-image: radial-gradient(circle at var(--L) var(--L), transparent calc(var(--L) - 1px), var(--line) var(--L), transparent calc(var(--L) + 1px));
  background-size: calc(2 * var(--L)) calc(2 * var(--L));
  background-position: 0 calc(var(--nav-h) - var(--L));

/* ---------- nav: the esa mark, its bar running the width of the page ---------- */
.nav { position: sticky; top: 0; z-index: 30; height: var(--nav-h); margin-inline: calc(-1 * var(--L)); padding: var(--nav-top) var(--L) var(--L4); background: var(--ground); transition: background-color 1.2s ease; }
.nav-inner { position: relative; height: var(--logo-h); }
.nav svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; color: var(--ink); }

.nav-right { position: absolute; right: 0; bottom: calc(50% + 5px); display: flex; gap: 18px; align-items: flex-end; }

.linkish:hover { color: var(--ink); }

@media (max-width: 620px) { .nav-right a.linkish[href="about.html"], .nav-right a.linkish[href="resume.html"] { display: none; } }

main { padding-block: calc(var(--L) * 0.6) var(--L); }
.eyebrow { margin: 0; color: var(--accent); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; }

/* ---------- cover ---------- */
.center { min-height: calc(100vh - var(--nav-h) - 2 * var(--L)); display: flex; flex-direction: column; justify-content: center; max-width: 900px; margin: 0 auto; }
.cover h1 { margin: 14px 0 26px; font-size: clamp(3rem, 10vw, 6.2rem); line-height: 0.92; letter-spacing: -0.035em; }
.cover .lines { display: grid; gap: 12px; max-width: 36ch; margin-bottom: 34px; }
.cover .lines p { margin: 0; font-size: clamp(1.1rem, 2.3vw, 1.4rem); line-height: 1.4; }
.cover .aside { margin: 22px 0 0; color: var(--muted); font-size: 0.9rem; max-width: 52ch; }
.cover .lines .record-demo { color: var(--record); position: relative; }
.primary { display: inline-flex; align-self: flex-start; align-items: baseline; gap: 14px; min-height: 52px; padding: 14px 22px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: var(--ground); font-size: 1.05rem; cursor: pointer; transition: background 160ms ease, color 160ms ease; }
.primary:hover { background: transparent; color: var(--ink); }

/* ---------- places ---------- */
.portals-head h2 { margin: 12px 0 8px; font-size: clamp(2rem, 5.4vw, 3.6rem); line-height: 1; letter-spacing: -0.03em; }
.portals-head p:not(.eyebrow) { margin: 0 0 30px; color: var(--muted); font-size: 1.05rem; max-width: 50ch; }
.portals { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 30px 0; }
.portal { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0; border: 0; background: none; text-align: center; cursor: pointer; }
.portal svg { display: block; width: 100%; max-width: 280px; height: auto; overflow: visible; }
.portal .ring { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.portal .glyph path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.portal .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
.portal .swatch { width: 44px; height: 6px; border-radius: 3px; }
.portal:hover .ring, .portal:focus-visible .ring, .portal:hover .glyph path, .portal:focus-visible .glyph path { stroke: var(--portal-accent); }
.portal:focus-visible { outline: none; }
.portal .place { font-weight: 700; font-size: clamp(1.05rem, 2vw, 1.25rem); }
.portal .region { color: var(--muted); font-size: 0.8rem; margin-top: -8px; }
.portal .lure { font-size: 0.95rem; line-height: 1.35; max-width: 24ch; }
.or { margin: 36px 0 10px; color: var(--muted); font-size: 0.9rem; text-align: center; }

/* ---------- the story: the drawing is the page; the words sit on a sheet of trace over it ---------- */
body[data-view="scene"] { overflow: hidden; height: 100vh; height: 100dvh; }
body[data-view="scene"] .nav { position: fixed; inset: 0 0 auto 0; margin: 0; background: transparent; pointer-events: none; }
/* The bar itself stays transparent so the drawing can be dragged under it; everything

body[data-view="scene"] .nav button, body[data-view="scene"] .nav a { pointer-events: auto; }

body[data-view="scene"] main { padding: 0; }
.scrim { position: fixed; inset: 0 0 auto 0; z-index: 2; height: calc(var(--nav-h) * 1.7); pointer-events: none; background: linear-gradient(to bottom, color-mix(in srgb, var(--ground) 72%, transparent), color-mix(in srgb, var(--ground) 0%, transparent)); }
body:not([data-view="scene"]) .scrim, body:not([data-view="scene"]) .canvas, body:not([data-view="scene"]) .plate, body:not([data-view="scene"]) .story-tab { display: none; }

.canvas { position: fixed; inset: 0; z-index: 1; overflow: hidden; touch-action: none; cursor: grab; outline: none; }
.canvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.canvas.dragging { cursor: grabbing; }
.canvas .media { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; opacity: 0; transition: opacity 700ms ease; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.canvas .media.on { opacity: 1; }
.canvas.easing .media { transition: opacity 700ms ease, transform 650ms cubic-bezier(.3,.7,.2,1); }

.trace { position: fixed; z-index: 10; top: calc(var(--nav-h) + var(--L4)); right: var(--L); bottom: var(--L4); width: var(--trace-w); border-radius: calc(var(--L4) * 1.2); isolation: isolate; background: color-mix(in srgb, var(--ground) 84%, transparent); -webkit-backdrop-filter: blur(16px) saturate(0.8); backdrop-filter: blur(16px) saturate(0.8); transition: transform 600ms cubic-bezier(.3,.7,.2,1), background-color 1.2s ease; }
.trace::before { position: absolute; z-index: 0; border-radius: inherit; background-attachment: fixed; opacity: 0.4; }
.trace .outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; color: var(--ink); z-index: 3; }
.trace-scroll { position: absolute; inset: 0; z-index: 1; overflow-y: auto; overscroll-behavior: contain; padding: 22px 26px 34vh 38px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
body.look .trace { transform: translateX(calc(100% + var(--L) + 8px)); }
.handle { display: none; }
.trace-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.lift { flex: none; border: 1px solid var(--line); border-radius: 999px; background: transparent; padding: 4px 11px; font-size: 0.76rem; cursor: pointer; }
.lift:hover { border-color: var(--ink); }
.legend { display: flex; align-items: baseline; gap: 8px; margin: 0 0 20px; color: var(--muted); font-size: 0.76rem; line-height: 1.4; }
.legend i, .cover .record-demo i { flex: none; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--record); transform: translateY(-1px); }
.cover .record-demo i { position: absolute; left: -18px; top: 0.62em; }
.story-tab { position: fixed; z-index: 11; right: 0; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; border: 0; border-radius: 10px 0 0 10px; padding: 16px 9px; background: color-mix(in srgb, var(--ground) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 0.82rem; letter-spacing: 0.04em; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 400ms ease; }
body.look .story-tab { opacity: 1; pointer-events: auto; }

.page { display: flex; flex-direction: column; gap: 11px; }
.line { position: relative; margin: 0; font-size: 1rem; line-height: 1.5; opacity: 0.76; transition: opacity 300ms ease; }
.line[data-media] { cursor: pointer; }
.line[data-media]:hover, .line.open { opacity: 0.95; }
.line.current { font-size: clamp(1.14rem, 1.55vw, 1.4rem); line-height: 1.32; letter-spacing: -0.01em; opacity: 1; }
.line.record { color: var(--record); }
.line.record::before { content: ""; position: absolute; left: -18px; top: calc(0.75em - 4px); width: 8px; height: 8px; border-radius: 50%; background: var(--record); }
.line.you { color: var(--muted); }
.line.enter { animation: rise 600ms ease both; }
.line.thinking { color: var(--muted); opacity: 1; animation: breathe 1.1s ease-in-out infinite alternate; }
.line .thumb { float: right; width: 30px; height: 30px; margin: 1px 0 4px 12px; border-radius: 6px; background: var(--line) center / cover no-repeat; box-shadow: 0 0 0 1px var(--line); transition: box-shadow 200ms ease; }
.line.showing .thumb { box-shadow: 0 0 0 2px var(--ground), 0 0 0 3.5px var(--ink); }
.source { margin: -2px 0 4px; padding: 9px 12px; border-left: 2px solid var(--record); border-radius: 0 8px 8px 0; background: color-mix(in srgb, var(--ground) 55%, transparent); font-size: 0.8rem; line-height: 1.45; color: var(--ink); animation: rise 300ms ease both; }
.source .from { display: block; margin-bottom: 4px; color: var(--record); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; }
.source p { margin: 0; }
.source p + p { margin-top: 5px; }
.place-mark { margin: 26px 0 2px; }
.place-mark:first-child { margin-top: 0; }
.divider { width: 44px; height: 1px; background: var(--line); margin: 8px 0; }

.controls { margin-top: 24px; display: grid; gap: 16px; }
.continue { justify-self: start; display: inline-flex; gap: 10px; align-items: baseline; padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; background: transparent; cursor: pointer; font-size: 0.92rem; }
.continue:hover { border-color: var(--ink); }
.continue kbd { color: var(--muted); font-family: inherit; font-size: 0.72rem; }
.card { padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
.card .kind { display: block; color: var(--accent); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
.card strong { display: block; font-size: 0.98rem; }
.card .ctx { color: var(--muted); font-size: 0.76rem; margin: 3px 0 6px; }
.card p { margin: 0; opacity: 0.85; font-size: 0.88rem; line-height: 1.35; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { display: inline-flex; align-items: baseline; gap: 10px; min-height: 42px; padding: 9px 14px; border: 1px solid var(--ink); border-radius: 999px; background: transparent; text-align: left; cursor: pointer; font-size: 0.92rem; animation: rise 450ms ease both; }
.choice:hover { background: var(--ink); color: var(--ground); }
.choice .mark { color: var(--accent); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; }
.choice:hover .mark { color: var(--ground); }
.choice.ask { border-style: dashed; }
.choice.reach { border-color: var(--accent); }
.ask-form { display: flex; border-bottom: 1px solid var(--ink); }
.ask-form input { flex: 1; min-width: 0; padding: 11px 2px; border: 0; background: transparent; font-size: 1.02rem; }
.ask-form input::placeholder { color: var(--muted); }

.ask-form:focus-within { border-bottom-color: var(--accent); box-shadow: 0 1px 0 var(--accent); }
.ask-form button { border: 0; background: transparent; padding: 0 4px 0 14px; cursor: pointer; }

.trail { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 30px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.75rem; }
.dots { display: flex; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--muted); }
.dot + .dot { margin-left: -1px; }
.dot.on { background: var(--accent); border-color: var(--accent); }
.noticed b { color: var(--ink); font-weight: 500; }

/* The plate: what you are looking at, and the tools to look closer. */
.plate { position: fixed; z-index: 9; left: var(--L); bottom: var(--L4); max-width: calc(100vw - var(--trace-w) - 3 * var(--L)); display: grid; gap: 8px; padding: 9px 10px 9px 14px; border-radius: 12px; background: color-mix(in srgb, var(--ground) 86%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-size: 0.8rem; transition: max-width 600ms ease, bottom 600ms cubic-bezier(.3,.7,.2,1); }
body.look .plate { max-width: calc(100vw - 2 * var(--L)); }
.plate[hidden] { display: none !important; }
.plate .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.plate .cap { min-width: 0; line-height: 1.35; }

.plate .tools button:hover:not(:disabled) { border-color: var(--line); }
.plate .tools button:disabled { opacity: 0.35; cursor: default; }
.plate .tools .count { color: var(--muted); font-variant-numeric: tabular-nums; padding: 0 2px; }
.plate .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.plate .now { border-color: var(--ink) !important; }
.plate .alt { margin: 0; max-width: 62ch; line-height: 1.45; }

/* the landing word: the page waits behind it */
.ls-word { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: var(--ground); color: var(--ink); cursor: pointer; transition: opacity 500ms ease; }
.ls-word svg { width: 100%; height: 100%; overflow: visible; }
.ls-word-prompt { position: absolute; left: 50%; bottom: 8vh; transform: translateX(-50%); margin: 0; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0; transition: opacity 600ms ease; }
.ls-word.is-ready .ls-word-prompt { opacity: 1; }
.ls-word.is-leaving { opacity: 0; pointer-events: none; }
.ls-word.is-leaving .ls-word-prompt { opacity: 0; }
body.ls-waiting .nav-right, body.ls-waiting main, body.ls-waiting .scrim { opacity: 0; }
body.ls-waiting { overflow: hidden; }
.nav-right { opacity: 0; transition: opacity 600ms ease; }
body.page-begun .nav-right { opacity: 1; transition-delay: 2.1s; }
main { transition: opacity 500ms ease; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { transform: none; } }
@keyframes breathe { from { opacity: 0.35; } to { opacity: 1; } }

@media (max-width: 900px) {
  body { padding-inline: 16px; }
  .nav { margin-inline: -16px; padding-inline: 16px; }

  .lift, .story-tab { display: none; }
  .plate { left: 16px; right: 16px; max-width: none; bottom: calc(var(--sheet-h) + 8px); padding: 7px 8px 7px 12px; font-size: 0.74rem; }
  body.look .plate { bottom: calc(var(--peek) + 8px); max-width: none; }
  .plate { gap: 2px; }

}

   "ethansWords": {
    "story": "The Revival Architecture Studio gave each of us one of eight Superfund sites and asked for regenerative interventions. Mine was USS Lead in East Chicago. Lead and arsenic are in the soil there, and the ground needs remediation, so I built the semester around phytoremediation: plants drawing the contamination back out.\n\nM1, The Dark Side of Chicago, is a 3 × 3 ft temporal site atlas. It follows East Chicago from oak savanna to the present and out into possible futures, drawn on the light cone.\n\nM2, the gable prototypes, answered the channel forms that run all through the region. I explored how the land relates to those channels, and whether the gables could take part in the remediation and let the ground go back to the dunes and swales that were native to it.\n\nM3, the EcoLounge Village, is what the gables became when I combined them. It takes its system from the Netherlands' dikes. The buildings' geometry, placement and orientation are set so that dunes grow on them naturally, rebuilding the dune and swale ecology, and the buildings are places where people work to help the dunes grow and the soil recover. The dunes are built from remediated soil taken out of the swales and channels that connect the landscape. There are three building types:\n\n- Guardians are the anchors that dunes build up on.\n- Dreamers are smaller utility and storage spaces.\n- Sleepers are connective and supportive.\n\nM4 is an architectural graphic novel covering a hundred years of the site. Birds tell it, through their run-ins with the land and with the forces that shape it (the west wind piling sand into dunes and swales). Hazel the Naturalist is based on Hazel M. Johnson, an environmental justice activist from the area.\n\nFrom M3 on, the work changed because of who I was working with. A partnership with a classmate, and my start with the Radical Accessibility Project, moved my thinking about stakeholders from who a design affects to who takes part in the design itself.",
    "process": "- I built the atlas on the light cone, the spacetime diagram where past and future cones meet at a single point, the present. A bright point sits at the centre of the sheet. The past runs back along a diagonal timeline, and coloured cones open toward possible futures.\n- The atlas also borrows features of the lemniscate, a shape I keep coming back to across my work\n- The diagonal band records soil sampling for lead and arsenic across the site's zones; atomic diagrams of lead (Pb) and arsenic (As) sit in the corner\n- M1 sketch sequence from August 28 to September 7, 2025, then Part B (September 8–14) and the midterm print (October 1)\n- The gables and the channels: the region's channels set the question for M2 (how does this land meet water that people cut into it?), and the leaning gable was the answer I carried forward\n- Wind as a character: in M4 the west wind builds the dunes and swales, and a bird asks whether it can land on the sand\n- Tactile tests: PIAF test prints in M3, then paired \"PIAF layer\" and \"no PIAF\" versions of M4 spreads, and layered laser-cut and 3D-printed versions of the Sleeper, Guardian and Dreamer types"

   "ethansWords": {
    "story": "The assignment was a genealogy of a device: trace where its parts come from, the way a smartphone battery is mined in one country and assembled in another. It assumed the maker is human, *homo faber*.\n\nI wanted to push back on that. There are builders in the more-than-human world too, so I traced a beaver dam instead. The booklet documents it like architecture: what it's made of and where each material comes from, how a site is chosen, how the foundation is set, and how the walls go up.\n\nIt grew out of the same semester's beaver research as Beaver's Burden, and it goes back to Paraguay, where a structure built to protect people didn't account for anything else living in the river.",
    "process": "- Materials: beavers are opportunistic. Mud comes from the stream bottom just upstream; rocks and coarse debris stand in where woody vegetation is scarce; the wood is aspen, willow, conifers, alders, sagebrush, tamarisk, birch and poplar; herbaceous and aquatic plants and agricultural residue fill in; so do human leftovers like fence posts and old beaver traps.\n- Site: narrow, shallow stretches take less material. Fast water gets an arched, curved dam; slow water, a straight one.\n- Foundation: larger branches and logs are driven into the streambed, thick ends anchored in mud, leaning upstream so the water's weight compresses the materials into a tight seal. Packed mud and stones secure the base.\n- Raising the walls: sticks, twigs, plant matter and mud are piled on the foundation's upstream face. The current pulls material into the gaps, sealing leaks on its own. The wall is wide at the base and tapers toward the top, raising the waterline.",
    "reflection": "Builders aren't only human. Documenting a beaver's dam with the same drawing conventions as a building was a way to give its maker the same standing."
   }

  // =================================================================
  // Asking
  // =================================================================
  function stopAsk() { if (state.ctl) { state.ctl.abort(); state.ctl = null; } state.busy = false; state.waiting = false; }

  function displayLines(text) {

      if (!inQuote && /[.!?]/.test(ch) && end && !/[.!?]/.test(text[i + 1] || '')) { out.push(buf.trim()); buf = ''; }
    }
    if (buf.trim()) out.push(buf.trim());
    return out;
  }

  async function ask(question) {
    if (state.busy) return;

    if (document.body.classList.contains('look')) setLook(false);
    state.queue = []; state.waiting = false;
    controlsEl.replaceChildren();
    if (pageEl.children.length) pageEl.append($('div', { class: 'divider', 'aria-hidden': 'true' }));
    addLine(`You ask, “${/[.?!]$/.test(question) ? question : question + '?'}”`, 'you');
    const thinking = $('p', { class: 'line thinking', text: state.metEthan ? 'Ethan thinks about it…' : 'The guide thinks about it…' });
    pageEl.append(thinking);
    state.busy = true;
    const ctl = new AbortController(); state.ctl = ctl;
    controlsEl.append($('button', { class: 'stop', type: 'button', text: 'Stop', onclick: () => { stopAsk(); thinking.remove(); renderEnd(fallbackChoices(), []); } }));

    let answer = null;

        if (e && e.code === 'not_granted') aiMode = 'declined';

  // After the check: remove unsupported claim lines; if no real answer is left, Ethan points the visitor to him.
  function applyVerdict(answer, record, skip) {

  function verifyPrompt(claims) {

  const BANNED = ['journey', 'tapestry', 'testament', 'delve', 'delves', 'unfolds', 'unfolding', 'resonate', 'resonates', 'evoke', 'evokes', 'elevate', 'elevates', 'vibrant', 'seamless', 'seamlessly', 'holistic', 'profound', 'nuanced', 'innovative'];
  const PHRASES = ['a sense of', 'speaks to', 'at the intersection of', 'invites you to', 'serves as a reminder'];
  function voiceError(t) {

  }
  const MAKING = /\b(?:designed|design|chose|choose|decided|because|so that|mix(?:ed)?|molds?|moulds?|grew|grown|grow|cultivat\w*|fabricat\w*|spawn|waste|tested|prototype\w*|studio|assignment|brief|professor|class|course|semester|built|build|made)\b/i;
  const PROJECT_IDS = new Set(PROJECTS.filter((p) => p.ethansWords).map((p) => p.id));

  // Names, numbers and months in a claim must appear in what it cites (or in the setting and the story so far).
  function ungrounded(text, facts, words) {

    const misses = [];
    (text.match(/\d[\d,.]*/g) || []).forEach((n) => { if (!pool.includes(n.replace(/[.,]$/, ''))) misses.push(n); });

    text.split(/(?<=[.!?:”])\s+/).forEach((sentence) => {
      sentence.replace(/^[“"‘(]+/, '').split(/\s+/).slice(1).forEach((w) => {
        const word = w.replace(/^[“"‘(]+|[”"’),.;:!?]+$/g, '');
        if (/^[A-Z][a-zà-ÿñ’'-]{2,}$/.test(word) && !/^(Ethan|You|Your|I|I’m|I’ve|I’d|The|A|An|And|But|So)$/.test(word) && !pool.includes(word.toLowerCase())) misses.push(word);
      });
    });
    return misses;
  }
  function validate(r) {
    if (!r || typeof r !== 'object' || !Array.isArray(r.narration)) return { ok: false, reason: 'no narration array' };
    const dropped = [], items = [], factIds = new Set(), projects = new Set();
    for (const item of r.narration.slice(0, 8)) {
      const text = normalize(String(typeof item === 'string' ? item : (item && item.text) || '').trim());
      if (!text) continue;
      const sources = Array.isArray(item && item.sources) ? item.sources.map(String) : [];
      const facts = [], words = []; let staging = false, world = false;
      for (const src of sources) {
        if (FACTS[src]) facts.push(src); else if (PROJECT_IDS.has(src)) words.push(src);
        else if (src === 'scene') staging = true; else if (src === 'world') world = true;
        else { const p = [...PROJECT_IDS].find((id) => src.startsWith(id)); if (p) words.push(p); }
      }
      const claim = facts.length + words.length > 0;
      const misses = claim ? ungrounded(text, facts, words) : [];
      const why = voiceError(text) ? 'voice rule' : text.length > 600 ? 'too long'
        : claim ? (misses.length ? `not in its sources: ${misses.join(', ')}` : null)
        : staging ? (/[“”]|\d/.test(text) ? 'staging line with speech or numbers' : MAKING.test(text) ? 'staging line about how the work was made' : null)
        : world ? (/\b(ethan|team|students|mylo|beaver’s burden|we|our|he|his|they)\b|[“”]/i.test(text) || MAKING.test(text) ? 'world line about the work' : null)
        : 'no source';
      if (why) { dropped.push({ text: text.slice(0, 200), why }); continue; }
      facts.forEach((f) => factIds.add(f)); words.forEach((p) => projects.add(p));
      items.push({ text, claim, kind: claim ? 'claim' : world ? 'world' : 'scene', facts, words });
    }
    const reachFlag = r.unanswered === true;
    if (!items.length && !reachFlag) return { ok: false, reason: 'every line dropped', dropped };
    const reach = reachable();
    const suggest = (Array.isArray(r.suggest) ? r.suggest : []).map((s) => {
      if (s && typeof s.ask === 'string' && s.ask.trim() && !voiceError(s.ask)) {
        const ok = Array.isArray(s.sources) && s.sources.some((x) => FACTS[x] || PROJECT_IDS.has(x));
        return ok ? { ask: normalize(s.ask.trim()).slice(0, 80) } : null;
      }
      if (s && typeof s.go === 'string') {
        let go = s.go;
        if (WORLD.scenes[go] && WORLD.scenes[go].setting !== state.setting && !isArrival(go)) go = arrivalOf(WORLD.scenes[go].setting);
        if (!reach.includes(go)) return null;
        const label = typeof s.label === 'string' && s.label.trim() && !voiceError(s.label) ? normalize(s.label).slice(0, 70) : '';
        return { go, label: go === s.go ? label : '' };
      }
      return null;
    }).filter(Boolean).slice(0, 3);
    const show = typeof r.show === 'string' && MEDIA[r.show] ? r.show : null;
    const interests = (Array.isArray(r.interests) ? r.interests : []).filter((t) => WORLD.interests.includes(t));
    if (reachFlag && !items.some((it) => /contact|directly|reach/i.test(it.text))) items.push(...REACH_LINES.map((text) => ({ text, claim: false, kind: 'scene', facts: [], words: [] })));
    return { ok: true, dropped, answer: { items, factIds: [...factIds], projects: [...projects], show, suggest, interests, reach: reachFlag } };
  }

  // No AI: answer straight from the notes, or point to Ethan.
  const STOP = new Set('a an the and or but of to in on at for with by from is are was were be been do does did how what why who where when which that this it its i you your me my we our can could would should about into there their them they he she his her whats tell show more some any just really'.split(' '));
  const SYN = { mushroom: 'mycelium', mushrooms: 'mycelium', fungus: 'mycelium', fungi: 'mycelium', takeout: 'to-go', box: 'container', insulation: 'straw', beavers: 'beaver', dams: 'dam', boat: 'vessel', raft: 'catama-raft', wear: 'wearable', eight: 'lemniscate', loop: 'lemniscate', teacher: 'professor', taught: 'professor', class: 'course', school: 'university', degree: 'bachelor', catch: 'transects', hardest: 'hardest', difficult: 'hardest', curve: 'arched', group: 'team', role: 'contributed', part: 'contributed' };
  const CONTACT = /\b(hire|hiring|job|work with|contact|email|resume|résumé|cv|reach|internship)\b/i;
  const stem = (w) => w.replace(/(ing|ed|es|s)$/, '');
  const words = (t) => t.toLowerCase().replace(/[^a-z0-9\-ñé ]/g, ' ').split(/\s+/).filter((w) => w && !STOP.has(w));
  function localAnswer(question) {
    const mk = (texts, extra = {}) => ({ items: texts.map((text) => ({ text, claim: false, kind: 'scene', facts: [], words: [] })), factIds: [], projects: [], show: null, suggest: [], interests: [], ...extra });
    if (CONTACT.test(question)) return mk(['Ethan grins. “The résumé and contact page are in the menu, whenever you want to step out of the story.”'], { reach: true });
    let q = question; if (/\bwhat did (?:ethan|you|he|they) do\b|\b(?:role|contribut)/i.test(q)) q += ' contributed led';
    const qs = words(q).flatMap((w) => [stem(w), SYN[w] ? stem(SYN[w]) : null]).filter(Boolean);
    const scored = Object.entries(FACTS).map(([id, text]) => { const ft = new Set(words(text).map(stem)); let s = qs.reduce((n, w) => n + (ft.has(w) ? 1 : 0), 0); if (s && state.scene && WORLD.scenes[state.scene].factIds.some((f) => projectOfFact[f] === projectOfFact[id])) s += 0.5; return [id, s]; }).filter(([, s]) => s >= 1.5).sort((a, b) => b[1] - a[1]);
    if (!scored.length) return mk([...REACH_LINES], { reach: true });
    const best = scored[0][0];
    return { reach: true, items: [{ text: 'Ethan pulls out a notebook and finds the page.', claim: false, kind: 'scene', facts: [], words: [] }, { text: FACTS[best], claim: true, kind: 'claim', facts: [best], words: [] }], factIds: [best], projects: [], show: null, suggest: [], interests: [] };
  }

  document.getElementById('restart').addEventListener('click', () => { stopAsk(); Object.assign(state, { view: 'cover', setting: null, scene: null, metEthan: false, visited: new Set(), seenProjects: new Set(), cardsShown: new Set(), interests: {}, story: [], queue: [], media: null, liveMedia: null }); trailEl = null; view.node = null; canvasEl.replaceChildren(); plateEl.hidden = true; renderCover(); });
  renderCover();
})();
</script>
