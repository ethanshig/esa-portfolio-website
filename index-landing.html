<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sustainable Architecture & Design Portfolio">
    <title>esa | Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing-simple.css">
    <link rel="stylesheet" href="css/page-transition.css">
    <script>
        // Apply theme immediately to prevent flash
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body class="landing-page">
    <!-- Landing Container -->
    <main class="landing-container">
        <!-- Grid overlay with interactive flip cards -->
        <div class="grid-overlay" id="grid-overlay">
            <!-- Grid cells will be generated by JavaScript -->
        </div>
    </main>

    <script src="js/theme-and-animations.js"></script>
    <script src="js/landing-simple.js"></script>
    <script src="js/page-transition.js"></script>
</body>
</html>
