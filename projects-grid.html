<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Projects - Sustainable Architecture & Design Portfolio">
    <title>Projects | esa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projects-grid.css">
    <link rel="stylesheet" href="css/page-transition.css">
    <script>
        // Apply theme immediately to prevent flash
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body class="projects-grid-page">

    <!-- Grid Overlay (Always Visible) -->
    <div class="grid-background" id="grid-background">
        <!-- Grid cells generated by JavaScript -->
    </div>

    <!-- Projects Content -->
    <main class="projects-container">

        <!-- Project 1 -->
        <article class="project-item" data-project="1">
            <div class="project-image-container">
                <img src="images/project1-thumb.jpg" alt="Sustainable Housing Complex" class="project-image">
                <div class="project-info-row">
                    <!-- Info cells generated by JavaScript -->
                </div>
            </div>
        </article>

        <!-- Project 2 -->
        <article class="project-item" data-project="2">
            <div class="project-image-container">
                <img src="images/project2-thumb.jpg" alt="Green Office Tower" class="project-image">
                <div class="project-info-row">
                    <!-- Info cells generated by JavaScript -->
                </div>
            </div>
        </article>

        <!-- Project 3 -->
        <article class="project-item" data-project="3">
            <div class="project-image-container">
                <img src="images/project3-thumb.jpg" alt="Urban Eco-Corridor" class="project-image">
                <div class="project-info-row">
                    <!-- Info cells generated by JavaScript -->
                </div>
            </div>
        </article>

        <!-- Project 4 -->
        <article class="project-item" data-project="4">
            <div class="project-image-container">
                <img src="images/project4-thumb.jpg" alt="Modular Eco-Home" class="project-image">
                <div class="project-info-row">
                    <!-- Info cells generated by JavaScript -->
                </div>
            </div>
        </article>

        <!-- Project 5 -->
        <article class="project-item" data-project="5">
            <div class="project-image-container">
                <img src="images/project5-thumb.jpg" alt="Community Learning Center" class="project-image">
                <div class="project-info-row">
                    <!-- Info cells generated by JavaScript -->
                </div>
            </div>
        </article>

    </main>

    <script src="js/theme-and-animations.js"></script>
    <script src="js/projects-grid.js"></script>
    <script src="js/page-transition.js"></script>
</body>
</html>
