<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Landing</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .test-container {
            text-align: center;
        }

        .esa-animation {
            font-size: 8rem;
            font-family: 'Sato', sans-serif;
            color: #1a1a1a;
            position: relative;
            display: inline-block;
        }

        .esa-text {
            position: relative;
            opacity: 0;
            animation: revealText 2s ease 1s forwards;
        }

        @keyframes revealText {
            to { opacity: 1; }
        }

        .esa-glow {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, rgba(255, 200, 100, 1) 0%, rgba(255, 220, 120, 0.7) 30%, transparent 70%);
            border-radius: 50%;
            filter: blur(6px);
            animation: tracePath 20s infinite;
            offset-rotate: 0deg;
        }

        @keyframes tracePath {
            0% { offset-distance: 0%; opacity: 0; }
            3% { opacity: 1; }
            97% { opacity: 1; }
            100% { offset-distance: 100%; opacity: 0; }
        }

        .status {
            margin-top: 2rem;
            font-family: 'Sato', sans-serif;
            color: #737373;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="esa-animation">
            <svg class="esa-svg" viewBox="0 -100 500 200" xmlns="http://www.w3.org/2000/svg" style="position: absolute; width: 100%; height: 100%; opacity: 0;">
                <path id="esa-path" d="M139.09,-32.94c.73-1.15,1.14-2.42,1.14-3.77,0-5.02-5.71-9.1-12.76-9.1s-12.76,4.07-12.76,9.1c0,1.6.49,2.94,1.5,4.25l.27.38c2.18,2.8,6.18,4.66,10.98,4.66,5.16,0,9.61-2.19,11.62-5.33l.37-.41c2.82-3.66,4.45-7.88,4.45-12.53,0-2.67-.54-5.24-1.53-7.64l-.54-.86c-3.46-4.95-9.18-7.36-15.89-7.36-5.86,0-12.14,2.24-14.66,6.41-2.64,4.21-6.25,13.01-9.93,18.5-3.43,5.5-9.97,9.22-17.47,9.22-6.33,0-11.97-2.65-15.64-6.78l-15.78-20.37c-1.87-3.54-7.74-5.78-14.83-5.78S4.93,7.98,2.88,11.35l-.09.16c-.51.84-.78,1.73-.78,2.66,0,4.68,6.96,8.47,15.54,8.47s15.54-3.79,15.54-8.47c0-.81.1-1.56-.29-2.31l-.13-.19c-1.87-3.54-7.85-6.12-14.94-6.12S5.01,7.98,2.97,11.35c-.71,1.21-1.66,4.03-1.66,4.03,0,0-1.18,4.27-1.18,6.53,0,9.04,7.84,16.36,17.51,16.36,5.69,0,10.16-2.47,13.94-6.46l15.69-17.46c3.75-5.29,10.32-8.81,17.8-8.81,7.09,0,13.37,3.16,17.2,8l14.04,20.04c2.18,2.8,6.36,4.69,11.16,4.69,5.16,0,9.61-2.19,11.62-5.33" />
            </svg>
            <span class="esa-text">esa</span>
            <div class="esa-glow" id="esa-glow"></div>
        </div>

        <div class="status">
            <p id="status">Initializing...</p>
        </div>
    </div>

    <script>
        // Simple test script
        const status = document.getElementById('status');
        const esaGlow = document.getElementById('esa-glow');
        const esaPath = document.getElementById('esa-path');

        status.textContent = 'Page loaded';

        if (esaGlow && esaPath) {
            const pathData = esaPath.getAttribute('d');
            if (pathData) {
                esaGlow.style.offsetPath = `path("${pathData}")`;
                status.textContent = 'Animation initialized - Glow should be tracing!';
            } else {
                status.textContent = 'ERROR: No path data found';
            }
        } else {
            status.textContent = 'ERROR: Missing elements';
        }

        console.log('Glow element:', esaGlow);
        console.log('Path element:', esaPath);
        console.log('Browser supports offset-path:', CSS.supports('offset-path', 'path("M 0 0")'));
    </script>
</body>
</html>
